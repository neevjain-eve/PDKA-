        const StatsCounter = ({ value, suffix, label }) => {
            const ref = useRef(null);
            const inView = useInView(ref, { once: true });
            const [count, setCount] = useState(0);

            useEffect(() => {
                if (inView) {
                    const duration = 2000;
                    const start = 0;
                    const end = value;
                    const increment = end / (duration / 16);
                    let current = start;
                    
                    const timer = setInterval(() => {
                        current += increment;
                        if (current >= end) {
                            setCount(end);
                            clearInterval(timer);
                        } else {
                            setCount(Math.floor(current));
                        }
                    }, 16);
                    
                    return () => clearInterval(timer);
                }
            }, [inView, value]);

            return (
                <motion.div 
                    ref={ref}
                    initial={{ opacity: 0, scale: 0.8 }}
                    whileInView={{ opacity: 1, scale: 1 }}
                    transition={{ duration: 0.8 }}
                    className="text-center"
                >
                    <div className="text-4xl lg:text-5xl font-bold bg-gradient-to-r from-gold-500 to-gold-600 bg-clip-text text-transparent mb-2">
                        {count.toLocaleString()}{suffix}
                    </div>
                    <div className="text-gray-600 dark:text-gray-400 text-sm font-medium">{label}</div>
                </motion.div>
            );

        );

        const App = () => {
            const [isDark, setIsDark] = useState(false);
            const [isScrolled, setIsScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setIsScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const toggleTheme = () => {
                setIsDark(!isDark);
                document.documentElement.classList.toggle('dark');
            };

            return (
                <div className={isDark ? 'dark' : ''}>
                    <Navbar isScrolled={isScrolled} toggleTheme={toggleTheme} isDark={isDark} />
                    <HeroSection />
                    <AboutSection />
                    <ServicesSection />
                    <ContactSection />
                    <Footer />
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
